name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            "*.blob.core.windows.net:443"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm
        uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - name: Verify tag matches package version and package is publishable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (pkg.private) {
              console.error("package.json has \"private\": true; remove it before releasing.");
              process.exit(1);
            }
            if (`v${pkg.version}` !== process.env.TAG) {
              console.error(`Tag ${process.env.TAG} does not match package.json version ${pkg.version}.`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Pack
        run: npm pack --pack-destination "${RUNNER_TEMP}/package"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Configure required reviewers on this environment so every release is approved.
    environment: npm
    permissions:
      contents: read # npm reads repository metadata
      id-token: write # npm trusted publishing (OIDC); no long-lived token is stored
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            "*.blob.core.windows.net:443"
            "*.actions.githubusercontent.com:443"
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - name: Publish
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: npm publish "${PACKAGE_DIR}"/*.tgz --access public
