APPLY_FIXES: none
ENABLE:
  - ACTION
  - JSON
  - MARKDOWN
  - YAML
DISABLE_LINTERS:
  # Formatting and TypeScript linting are owned by Biome (npm run lint), which MegaLinter's
  # bundled version can't read from .config/biome.json.
  - JSON_BIOME
  - JSON_PRETTIER
  - YAML_PRETTIER
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  # Fetches remote schemas, which the hardened runner blocks.
  - JSON_V8R
  - YAML_V8R
  - MARKDOWN_MARKDOWN_LINK_CHECK
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
UPDATED_SOURCES_REPORTER: false
SARIF_REPORTER: false
EMAIL_REPORTER: false
FILTER_REGEX_EXCLUDE: (package-lock\.json)
